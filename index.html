<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DURU HAZIR BETON — Konya Selçuklu'da hazır beton üretimi, pompa hizmeti ve proje bazlı karışım. 2015'ten beri, 500'ün üzerinde proje." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Carme&family=Inter+Tight:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="assets/hero.webp" fetchpriority="high" />
    <title>DURU HAZIR BETON — İyi Beton, Tam Saatinde | Konya</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#08080a" />
    <style>
      html,
      body {
        margin: 0;
        background: #08080a;
        color: #d8d0bd;
        font-family: "Inter Tight", system-ui, -apple-system, Arial, sans-serif;
      }
      /* Statik iskelet: JS yüklenene kadar görünür, React mount olunca silinir */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        padding: 24px;
        z-index: 9999;
        background: #08080a;
      }
      #boot .marklogo {
        height: 46px;
        width: auto;
      }
      #boot .mark {
        width: 44px;
        height: 44px;
        background: #a3ad87;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Carme, "Trebuchet MS", Arial, sans-serif;
        font-size: 20px;
        color: #08080a;
      }
      #boot .bar {
        width: 190px;
        height: 2px;
        background: rgba(231, 227, 220, 0.14);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #a3ad87;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      #boot small {
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-size: 10px;
        color: rgba(184, 180, 173, 0.55);
      }
      #boot .err {
        display: none;
        max-width: 460px;
        line-height: 1.7;
        font-size: 13px;
        color: rgba(231, 227, 220, 0.8);
        border: 1px solid rgba(255, 77, 23, 0.4);
        padding: 20px;
      }
      #boot .err b { color: #a3ad87; }
      #boot .err code {
        background: rgba(255, 255, 255, 0.07);
        padding: 2px 6px;
        font-size: 12px;
      }
    </style>

  <body>
    <div id="root"></div>

    <div id="boot">
      <img class="marklogo" src="assets/logo.png" alt="Duru Hazır Beton" />
      <small>yükleniyor</small>
      <div class="bar"><i></i></div>

      <div class="err" id="boot-err">
        <b>Sayfa açılamadı.</b><br /><br />
        Tarayıcılar güvenlik nedeniyle dosyayı doğrudan (<code>file://</code>) açarken
        engelleyebiliyor.<br /><br />
        <b>Çözüm:</b> Proje klasöründe terminal aç ve şunu yaz:<br />
        <code>npx serve .</code><br /><br />
        Ardından çıkan adresi (örn. <code>http://localhost:3000</code>) tarayıcıda aç.
      </div>
    </div>

    <noscript>
      <div style="padding: 40px; text-align: center">
        Bu site için JavaScript gereklidir. Lütfen tarayıcı ayarlarından etkinleştirin.
      </div>
    </noscript>

    <script>
      // React 6 saniye içinde mount olmazsa kullanıcıya sebebini göster
      window.__bootTimer = setTimeout(function () {
        var b = document.getElementById("boot");
        if (!b) return;
        var e = document.getElementById("boot-err");
        if (e) e.style.display = "block";
      }, 6000);
      window.addEventListener("error", function () {
        var e = document.getElementById("boot-err");
        if (e) e.style.display = "block";
      });
    </script>

  </body>
